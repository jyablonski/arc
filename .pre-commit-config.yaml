# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
default_language_version:
  golang: "1.27.0"

repos:
  # General file formatting
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--unsafe"] # Allow custom YAML tags
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: mixed-line-ending

  # YAML formatting
  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
        args: ["-formatter", "retain_line_breaks=true"]

  # Go formatting
  - repo: https://github.com/tekwizely/pre-commit-golang
    rev: v1.0.0-rc.4
    hooks:
      - id: go-mod-tidy
      - id: go-imports

  # Go simplification
  - repo: local
    hooks:
      - id: gofmt-s
        name: gofmt -s
        language: system
        entry: gofmt -w -s
        types: [go]

      # Regenerates internal/*_moq.go from //go:generate go tool moq (see Makefile mocks)
      - id: go-generate-moq
        name: go generate (moq)
        language: system
        entry: bash -c 'go generate ./...'
        pass_filenames: false
        files: ^(internal/.*\.go|go\.mod|go\.sum)$

  # Matches the golangci-lint version installed by the CI quality job.
  - repo: https://github.com/golangci/golangci-lint
    rev: 6fb5dee3889d231640dce56e5e71c522f13aef7e
    hooks:
      - id: golangci-lint-full
        entry: golangci-lint run --timeout=5m ./...

  # Go dead code detection
  - repo: local
    hooks:
      - id: deadcode
        name: deadcode
        language: golang
        additional_dependencies:
          - golang.org/x/tools/cmd/deadcode@v0.45.0
        entry: deadcode
        args: [-test, ./...]
        pass_filenames: false
        types: [go]
