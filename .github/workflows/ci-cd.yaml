name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.0"
  GOLANGCI_LINT_VERSION: "v2.13.2-0.20260821235006-6fb5dee3889d"
  GO_TOOLS_VERSION: "v0.45.0"

permissions:
  contents: write

jobs:
  ci:
    name: CI Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify dependencies
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "Dependencies are out of sync. Run 'go mod tidy' and commit the changes." && exit 1)

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      # runs tests and outputs results to `coverage.out` for Coveralls
      - name: Run tests with coverage
        run: make test-ci

      - name: Send coverage to Coveralls
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: |
          go install github.com/mattn/goveralls@latest
          goveralls -coverprofile=coverage.out -service=github
        env:
          COVERALLS_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build binary
        run: make build

      - name: Verify binary
        run: ./bin/arc --version

  # ensure tests can compile for darwin while on linux
  darwin-compile:
    name: Darwin compile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Compile tests for macOS
        run: |
          GOOS=darwin GOARCH=arm64 go test -exec=true ./...
          GOOS=darwin GOARCH=amd64 go test -exec=true ./...

  # ensure tests can run in macos env
  darwin-runtime:
    name: Darwin runtime tests
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run tests
        run: go test ./...

  quality:
    name: Go quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Install quality tools
        run: |
          set -euo pipefail
          mkdir -p .bin
          GOBIN="$PWD/.bin" go install "golang.org/x/tools/cmd/deadcode@${GO_TOOLS_VERSION}"
          GOBIN="$PWD/.bin" go install "golang.org/x/tools/cmd/goimports@${GO_TOOLS_VERSION}"
          GOBIN="$PWD/.bin" go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          echo "$PWD/.bin" >> "$GITHUB_PATH"

      - name: Verify formatting (gofmt)
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l -s .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted with gofmt -s:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify imports (goimports)
        run: |
          set -euo pipefail
          unformatted="$(goimports -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted with goimports:"
            echo "$unformatted"
            exit 1
          fi

      - name: golangci-lint
        run: golangci-lint run --timeout=5m ./...

      - name: Run deadcode
        run: deadcode -test ./...

  release:
    name: Release Pipeline
    needs: [ci, darwin-compile, darwin-runtime, quality]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Get version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build release binary
        run: |
          mkdir -p bin
          GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o bin/arc-linux-amd64 .
          GOOS=darwin GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o bin/arc-darwin-arm64 .
          GOOS=darwin GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o bin/arc-darwin-amd64 .
        env:
          VERSION: ${{ steps.version.outputs.version }}
          LDFLAGS: -X github.com/jyablonski/arc/cmd.version=${{ steps.version.outputs.version }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/arc-linux-amd64
            bin/arc-darwin-arm64
            bin/arc-darwin-amd64
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Deploy Notification
    needs: release
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Slack Alert
        uses: jyablonski/actions/alert@v1
        with:
          status: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
