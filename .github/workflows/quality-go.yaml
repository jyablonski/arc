name: Go Quality Checks

on:
  push:
    branches:
      - main
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".pre-commit-config.yaml"
      - ".github/workflows/quality-go.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".pre-commit-config.yaml"
      - ".github/workflows/quality-go.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"
  GOLANGCI_LINT_VERSION: "v2.12.1"
  GO_TOOLS_VERSION: "v0.44.0"

jobs:
  quality:
    name: Go quality
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Install quality tools
        run: |
          set -euo pipefail
          mkdir -p .bin
          GOBIN="$PWD/.bin" go install "golang.org/x/tools/cmd/deadcode@${GO_TOOLS_VERSION}"
          GOBIN="$PWD/.bin" go install "golang.org/x/tools/cmd/goimports@${GO_TOOLS_VERSION}"
          echo "$PWD/.bin" >> "$GITHUB_PATH"

      - name: Verify formatting (gofmt)
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l -s .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted with gofmt -s:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify imports (goimports)
        run: |
          set -euo pipefail
          unformatted="$(find . -name '*.go' -not -path './vendor/*' -print0 | xargs -0 goimports -l)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted with goimports:"
            echo "$unformatted"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      - name: Run deadcode
        run: deadcode -test ./...
